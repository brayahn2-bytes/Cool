<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dedicatoria para Clau</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .entrance-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #3a3a3a 0%, #1a1a1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

            .entrance-screen.hide {
                opacity: 0;
                pointer-events: none;
            }

        .entrance-text {
            color: white;
            font-size: 3rem;
            margin-bottom: 30px;
            text-align: center;
            animation: pulse 2s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .start-button {
            background: linear-gradient(135deg, #ff69b4 0%, #ff85c0 100%);
            color: white;
            font-size: 1.5rem;
            padding: 20px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.5);
            transition: all 0.3s;
            font-weight: bold;
            margin-top: 20px;
            letter-spacing: 1px;
        }

            .start-button:hover {
                transform: scale(1.05);
                box-shadow: 0 15px 40px rgba(255, 105, 180, 0.7);
            }

            .start-button:active {
                transform: scale(0.98);
            }

        .start-button {
            background: linear-gradient(135deg, #ff69b4 0%, #ff85c0 100%);
            color: white;
            font-size: 1.5rem;
            padding: 20px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.5);
            transition: all 0.3s;
            font-weight: bold;
            margin-top: 20px;
        }

            .start-button:hover {
                transform: scale(1.05);
                box-shadow: 0 15px 40px rgba(255, 105, 180, 0.7);
            }

            .start-button:active {
                transform: scale(0.98);
            }

        .tap-instruction {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.8rem;
            animation: blink 1.5s ease-in-out infinite;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .main-content {
            background: linear-gradient(135deg, #FFB6C1 0%, #FFC0CB 40%, #FFD1DC 70%, #FFF0F5 100%);
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            opacity: 0;
            transition: opacity 1s ease;
            padding: 20px;
        }

            .main-content.show {
                opacity: 1;
            }

        .particle {
            position: absolute;
            font-size: 25px;
            animation: float 15s infinite;
            opacity: 0;
        }

            .particle.blue {
                color: #87CEEB;
            }

            .particle.lightblue {
                color: #ADD8E6;
            }

            .particle.white {
                color: #FFFFFF;
                text-shadow: 0 0 5px rgba(0,0,0,0.2);
            }

            .particle.cyan {
                color: #00CED1;
            }

            .particle.skyblue {
                color: #6CB4EE;
            }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.9;
            }

            90% {
                opacity: 0.9;
            }

            100% {
                transform: translateY(-100px) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
            max-width: 700px;
            width: 95%;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #d63384;
            font-size: 2.3rem;
            margin-bottom: 25px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .love-text {
            color: #333;
            font-size: 1.4rem;
            line-height: 2.2;
            margin-bottom: 35px;
            font-weight: 400;
            letter-spacing: 0.8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .flower-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 30px auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .flower-video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 20px;
        }

        .trust-message {
            background: linear-gradient(135deg, #ff69b4 0%, #ff85c0 50%, #ffa5d8 100%);
            padding: 35px;
            border-radius: 20px;
            color: white;
            margin-top: 35px;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4);
            position: relative;
        }

            .trust-message h2 {
                font-size: 2.2rem;
                margin: 0;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 15px;
                flex-wrap: wrap;
            }

        .korean-heart {
            display: inline-block;
            font-size: 2.5rem;
            animation: heartBeat 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.2);
            }

            50% {
                transform: scale(1);
            }

            75% {
                transform: scale(1.15);
            }
        }

        /* Reproductor de música mejorado */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            min-width: 300px;
            backdrop-filter: blur(10px);
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #d63384;
            font-weight: bold;
        }

        .song-title {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff69b4 0%, #ff85c0 100%);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .control-btn:hover {
                transform: scale(1.1);
                box-shadow: 0 4px 15px rgba(255, 105, 180, 0.5);
            }

            .control-btn.play-pause {
                width: 55px;
                height: 55px;
                font-size: 24px;
            }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff69b4 0%, #ff85c0 100%);
            width: 0%;
            transition: width 0.1s;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #666;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .volume-slider {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #e0e0e0;
            border-radius: 2px;
            outline: none;
        }

            .volume-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 14px;
                height: 14px;
                background: #ff69b4;
                border-radius: 50%;
                cursor: pointer;
            }

            .volume-slider::-moz-range-thumb {
                width: 14px;
                height: 14px;
                background: #ff69b4;
                border-radius: 50%;
                cursor: pointer;
                border: none;
            }

        .playlist-toggle {
            margin-top: 10px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #666;
            text-align: center;
            display: none; /* Ocultar lista de reproducción */
        }

            .playlist-toggle:hover {
                background: #e8e8e8;
            }

        .playlist {
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

            .playlist.show {
                display: block;
            }

        .playlist-item {
            padding: 10px;
            background: #f9f9f9;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

            .playlist-item:hover {
                background: #ffe6f0;
            }

            .playlist-item.active {
                background: linear-gradient(135deg, #ff69b4 0%, #ff85c0 100%);
                color: white;
            }

        @media (max-width: 600px) {
            .container {
                padding: 30px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .love-text {
                font-size: 1.2rem;
            }

            .trust-message h2 {
                font-size: 1.7rem;
            }

            .music-player {
                min-width: 250px;
                right: 10px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="entrance-screen" id="entranceScreen">
        <div class="entrance-text">💕 🐱 💖</div>
        <button class="start-button" id="startBtn">INICIAR 🎵</button>
    </div>

    <div class="main-content" id="mainContent">
        <audio id="bgMusic"></audio>

        <!-- Reproductor de música -->
        <div class="music-player" id="musicPlayer">
            <div class="player-header">
                <span>🎵</span>
                <span>Reproductor</span>
            </div>

            <div class="song-title" id="songTitle">Cargando...</div>

            <div class="controls">
                <button class="control-btn" onclick="previousSong()" title="Anterior">⏮</button>
                <button class="control-btn play-pause" onclick="togglePlay()" id="playBtn">▶</button>
                <button class="control-btn" onclick="nextSong()" title="Siguiente">⏭</button>
                <button class="control-btn" onclick="toggleRepeat()" id="repeatBtn" title="Repetir">🔁</button>
            </div>

            <div class="progress-container" onclick="seek(event)">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="volume-control">
                <span>🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" oninput="changeVolume(this.value)">
            </div>

            <div class="playlist-toggle" onclick="togglePlaylist()">
                Ver lista de reproducción ▼
            </div>

            <div class="playlist" id="playlist"></div>
        </div>

        <div class="container">
            <h1>Para Clau la niña tímida 🐱</h1>

            <p class="love-text">
                Amar no es algo que todos sepan hacer bien,<br>
                pero tú lo haces con naturalidad<br>
                que se siente en cada detalle.<br><br>
                No cambies esa forma tan bonita<br>
                que tienes al amar.
            </p>

            <div class="flower-container">
                <video class="flower-video" autoplay loop muted playsinline>
                    <source src="FlorCool.mp4" type="video/mp4">
                </video>
            </div>

            <div class="trust-message">
                <h2>
                    <span class="korean-heart">🫰</span>
                    Confía en ti siempre
                    <span class="korean-heart">🫰</span>
                </h2>
            </div>
        </div>
    </div>

    <script>
        // Lista de canciones - AGREGA TUS ARCHIVOS MP3 AQUÍ
        const playlist = [
            { title: "BTS - Canción 1", file: "bts.mp3" },
            { title: "BTS - Canción 2", file: "bts2.mp3" },
            { title: "BTS - Canción 3", file: "bts3.mp3" },
        ];

        let currentSongIndex = 0;
        let isPlaying = false;
        let isRepeat = false;
        const music = document.getElementById('bgMusic');

        function createHeartParticles() {
            const mainContent = document.getElementById('mainContent');
            const colors = ['blue', 'lightblue', 'white', 'cyan', 'skyblue'];

            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle ' + colors[Math.floor(Math.random() * colors.length)];
                particle.textContent = '♥';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                mainContent.appendChild(particle);
            }
        }

        function loadPlaylist() {
            const playlistEl = document.getElementById('playlist');
            playlistEl.innerHTML = '';

            playlist.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item' + (index === currentSongIndex ? ' active' : '');
                item.textContent = song.title;
                item.onclick = () => playSongByIndex(index);
                playlistEl.appendChild(item);
            });
        }

        function loadSong(index) {
            const song = playlist[index];
            music.src = song.file;
            document.getElementById('songTitle').textContent = song.title;
            updatePlaylistUI();
        }

        function updatePlaylistUI() {
            const items = document.querySelectorAll('.playlist-item');
            items.forEach((item, index) => {
                item.className = 'playlist-item' + (index === currentSongIndex ? ' active' : '');
            });
        }

        function togglePlay() {
            if (isPlaying) {
                music.pause();
                document.getElementById('playBtn').textContent = '▶';
            } else {
                music.play();
                document.getElementById('playBtn').textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }

        function previousSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) music.play();
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) music.play();
        }

        function playSongByIndex(index) {
            currentSongIndex = index;
            loadSong(index);
            music.play();
            isPlaying = true;
            document.getElementById('playBtn').textContent = '⏸';
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            music.loop = isRepeat;
            document.getElementById('repeatBtn').style.opacity = isRepeat ? '1' : '0.5';
        }

        function changeVolume(value) {
            music.volume = value / 100;
        }

        function seek(event) {
            const progressContainer = event.currentTarget;
            const clickX = event.offsetX;
            const width = progressContainer.offsetWidth;
            const duration = music.duration;
            music.currentTime = (clickX / width) * duration;
        }

        function togglePlaylist() {
            const playlistEl = document.getElementById('playlist');
            playlistEl.classList.toggle('show');
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Actualizar progreso
        music.addEventListener('timeupdate', () => {
            const progress = (music.currentTime / music.duration) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('currentTime').textContent = formatTime(music.currentTime);
        });

        music.addEventListener('loadedmetadata', () => {
            document.getElementById('duration').textContent = formatTime(music.duration);
        });

        // Auto siguiente canción
        music.addEventListener('ended', () => {
            if (!isRepeat) {
                nextSong();
            }
        });

        function enterSite() {
            const entrance = document.getElementById('entranceScreen');
            const mainContent = document.getElementById('mainContent');

            // Cargar primera canción ANTES de ocultar pantalla
            loadPlaylist();
            loadSong(0);

            entrance.classList.add('hide');

            setTimeout(() => {
                mainContent.classList.add('show');
                createHeartParticles();

                // Intentar reproducir inmediatamente después de la interacción del usuario
                music.play().then(() => {
                    isPlaying = true;
                    document.getElementById('playBtn').textContent = '⏸';
                    console.log('✅ Música reproduciendo');
                }).catch(error => {
                    console.log('❌ Error autoplay:', error);
                    // Si falla, intentar de nuevo después de un momento
                    setTimeout(() => {
                        music.play().then(() => {
                            isPlaying = true;
                            document.getElementById('playBtn').textContent = '⏸';
                        }).catch(err => {
                            console.log('⚠️ Haz clic en el botón de play');
                            alert('Por favor, presiona el botón ▶ para reproducir la música');
                        });
                    }, 500);
                });
            }, 300);
        }

        window.addEventListener('load', () => {
            music.volume = 0.7;

            // Obtener el botón de inicio
            const startBtn = document.getElementById('startBtn');

            // Manejar click y touch del botón
            startBtn.addEventListener('click', function (e) {
                e.preventDefault();
                enterSite();
            });

            startBtn.addEventListener('touchend', function (e) {
                e.preventDefault();
                enterSite();
            }, { passive: false });
        });
    </script>
</body>
</html>
